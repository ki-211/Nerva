[package]
name = "nerva-user-desktop"
version = "0.1.0"
description = "Nerva user desktop client"
authors = ["Nerva"]
edition = "2021"

[lib]
name = "nerva_user_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = { version = "2", features = ["multipart", "stream"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
url = "2"
